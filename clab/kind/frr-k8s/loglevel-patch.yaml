apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: frr-k8s-daemon
  namespace: frr-k8s-system
spec:
  template:
    spec:
      containers:
      - name: controller
        args:
        - "--metrics-bind-address=0.0.0.0:9140"
        - "--node-name=$(NODE_NAME)"
        - "--log-level=debug"
        - "--namespace=$(NAMESPACE)"
