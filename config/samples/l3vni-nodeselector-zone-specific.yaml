---
# L3VNI for us-east-1a
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: tenant-b-east
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/zone: us-east-1a
  vrf: tenant-b
  vni: 6001
  hostSession:
    asn: 64512
    hostASN: 64601
    localCIDRs:
      - 192.169.3.0/24
---
# L3VNI for us-west-1a
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: tenant-b-west
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/zone: us-west-1a
  vrf: tenant-b
  vni: 6002
  hostSession:
    asn: 64513
    hostASN: 64601
    localCIDRs:
      - 192.169.4.0/24
