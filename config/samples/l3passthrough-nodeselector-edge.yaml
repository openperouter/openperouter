# L3Passthrough for edge nodes
apiVersion: network.openperouter.io/v1alpha1
kind: L3Passthrough
metadata:
  name: edge-passthrough
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/edge: ""
  hostSession:
    asn: 64512
    hostASN: 64700
    localCIDRs:
      - 192.169.20.0/24
