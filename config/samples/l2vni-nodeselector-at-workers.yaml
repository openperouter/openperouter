# L2VNI for worker nodes only
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: app-network
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  vni: 10100
  vxlanPort: 4789
  routingDomain:
    type: L3VNI
    l3vni:
      name: app-l3vni
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
  gatewayIPs:
    - 10.100.0.1/24

