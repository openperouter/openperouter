---
# Tenant A VNI on worker nodes
apiVersion: network.openperouter.io/v1alpha1
kind: L3VNI
metadata:
  name: tenant-a-vni
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  vrf: tenant-a
  vni: 5001
  hostSession:
    asn: 64512
    hostASN: 64600
    localCIDRs:
      - 192.169.5.0/24
---
