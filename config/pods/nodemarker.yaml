apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodemarker
  namespace: system
  labels:
    component: nodemarker
    app.kubernetes.io/name: nodemarker
    app.kubernetes.io/instance: nodemarker
    app.kubernetes.io/component: nodemarker
    app.kubernetes.io/created-by: nodemarker
    app.kubernetes.io/part-of: nodemarker
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: nodemarker
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nodemarker
      labels:
        component: nodemarker
        control-plane: nodemarker
        app: nodemarker
    spec:
      containers:
      - command:
        - /nodemarker
        args:
        - "--loglevel=debug"
        - "--namespace=$(NAMESPACE)"
        - "--webhookmode=disabled"
        - "--disable-cert-rotation=true"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: router:latest
        imagePullPolicy: IfNotPresent
        name: nodemarker
        ports:
          - containerPort: 8081
            name: health
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
            scheme: HTTP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: nodemarker
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
