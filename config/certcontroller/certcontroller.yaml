apiVersion: apps/v1
kind: Deployment
metadata:
  name: certcontroller
  namespace: system
  labels:
    component: certcontroller
    app.kubernetes.io/name: certcontroller
    app.kubernetes.io/instance: certcontroller
    app.kubernetes.io/component: certcontroller
    app.kubernetes.io/created-by: certcontroller
    app.kubernetes.io/part-of: certcontroller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: certcontroller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: certcontroller
      labels:
        component: certcontroller
        control-plane: certcontroller
        app: certcontroller
    spec:
      containers:
      - command:
        - /certcontroller
        args:
        - "--loglevel=debug"
        - "--namespace=$(NAMESPACE)"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: router:latest
        imagePullPolicy: IfNotPresent
        name: certcontroller
        ports:
          - containerPort: 8081
            name: health
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
            scheme: HTTP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
        # No keys are listed, so the pod starts while the Secret is still
        # empty and the certificate shows up once the controller writes it.
        - name: cert
          secret:
            defaultMode: 420
            secretName: openpe-webhook-server-cert
      serviceAccountName: certcontroller
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
