apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: system
  labels:
    component: webhook
    app.kubernetes.io/name: webhook
    app.kubernetes.io/instance: webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: webhook
    app.kubernetes.io/part-of: webhook
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      control-plane: webhook
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: webhook
      labels:
        component: webhook
        control-plane: webhook
        app: webhook
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  control-plane: webhook
      # Covers the preStop delay plus the admission webhook timeout, so
      # in-flight requests finish before the container is killed.
      terminationGracePeriodSeconds: 20
      containers:
      - command:
        - /webhook
        args:
        - "--loglevel=debug"
        - "--namespace=$(NAMESPACE)"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: router:latest
        imagePullPolicy: IfNotPresent
        name: webhook
        ports:
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: webhook-server
            scheme: HTTPS
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: webhook-server
            scheme: HTTPS
        lifecycle:
          # Lets the endpoint removal propagate before the server stops.
          preStop:
            exec:
              command:
              - sleep
              - "5"
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      serviceAccountName: webhook
      volumes:
        # The listed keys keep the pod from starting until the certificate
        # controller has written the certificate. OLM replaces the volume
        # with this name by one backed by the certificate it manages.
        - name: webhook-cert
          secret:
            defaultMode: 420
            secretName: openpe-webhook-server-cert
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook
  namespace: system
  labels:
    component: webhook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      control-plane: webhook
