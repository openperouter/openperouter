l2vnis:
  - name: l2vni-storage
    vni: 300
    vxlanPort: 4789
    routingDomain:
      type: L3VNI
      l3vni:
        name: l3vni-red
    hostMaster:
      type: LinuxBridge
      linuxBridge:
        lifecycle: External
        name: br-storage
  - name: l2vni-management
    vni: 400
    vxlanPort: 4789
    routingDomain:
      type: L3VNI
      l3vni:
        name: l3vni-blue
    hostMaster:
      type: OVSBridge
      ovsBridge:
        lifecycle: External
        name: ovsbr0
