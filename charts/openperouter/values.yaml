# Default values for openperouter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

rbac:
  # create specifies whether to install and use RBAC rules.
  create: true

openperouter:
  # -- Controller log level. Must be one of: `debug`, `info`, `warn` or `error`.
  logLevel: info
  # -- Maximum number of dynamic BGP sessions accepted via underlay listen
  # ranges (FRR `bgp listen limit`, 1-65535).
  bgpListenLimit: 65535
  # -- (int) Maximum retry delay in seconds after failed API reconciliation. Unset uses the controller default rate limiter.
  maxReconcileBackoffSeconds: null
  # -- If true, enables host mode deployment: deploys hostbridge DaemonSet instead of router and controller,
  # and configures nodemarker to run in webhook-only mode
  hostmode: false
  image:
    repository: quay.io/openperouter/router
    tag: ""
    pullPolicy: ""
  ## ref: https://kubernetes.io/docs/tasks/manage-daemon/update-daemon-set/
  ##
  updateStrategy:
    ## StrategyType
    ## Can be set to RollingUpdate or OnDelete
    ##
    type: RollingUpdate
  serviceAccounts:
    # Specifies whether the ServiceAccounts should be created
    create: true
    # The names of the ServiceAccounts to use. If not set and create is
    # true, a name is generated using the fullname template
    controller:
      name: ""
    nodemarker:
      name: ""
    perouter:
      name: ""
    annotations: {}
  # -- Node selector to constrain all openperouter pods (router, controller,
  # nodemarker, hostbridge) to nodes with matching labels.
  nodeSelector: {}
  # -- Tolerations for all openperouter pods (router, controller, nodemarker,
  # hostbridge). Defaults to tolerating control-plane/master node taints so
  # the pods can run there.
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  priorityClassName: ""
  # -- Affinity rules for all openperouter pods (router, controller,
  # nodemarker, hostbridge).
  affinity: {}
  ## Selects which runtime class will be used by the pod.
  runtimeClassName: ""
  podAnnotations: {}
  labels: {}
  controller:
    resources: {}
    # -- Health probe port for liveness and readiness checks
    healthProbePort: 9081
    # -- CNI plugin binary directories. The default matches the path baked into
    # the controller image. Override only to use externally-provided binaries
    # (e.g. host-mounted).
    cniPluginDirs:
      - "/opt/openperouter/cni/bin/"
    # -- CNI cache directory for persistent CNI state across pod restarts
    cniCacheDir: "/var/lib/openperouter/cni/cache"
  nodemarker:
    # -- Replicas of the nodemarker. Every replica serves the webhooks; the replicas
    # elect a leader through a Lease, and only the leader runs the node-index
    # reconciler and the certificate rotator.
    replicas: 2
    # -- How the replicas are spread over nodes when there is more than one:
    # "required", "preferred", or "" for none. Added to openperouter.affinity.
    antiAffinity: required
    # -- Deployment strategy when there is more than one replica. maxSurge 0 replaces
    # one replica at a time, which also works when only as many nodes as replicas
    # are eligible under "required" anti-affinity.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    # -- PodDisruptionBudget of the nodemarker. Rendered only with more than one
    # replica: with one, minAvailable 1 would block every node drain.
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # -- Timings of the Lease the replicas elect a leader with.
    leaderElection:
      leaseDuration: 15s
      renewDeadline: 10s
      retryPeriod: 2s
    # -- Seconds a terminating replica keeps serving. Its endpoint is removed when
    # termination starts, but the API server can still send it requests for a
    # moment. 0 disables the delay; keep it below terminationGracePeriodSeconds.
    preStopSleepSeconds: 5
    # -- Liveness probe of the nodemarker. A replica busy with a burst of admission
    # calls can answer late, and a restart drops every call in flight.
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    resources: {}
  # frr contains configuration specific to the perouter FRR container,
  frr:
    image:
      repository: quay.io/openperouter/openperouter
      tag: ""
      pullPolicy: ""
    resources: {}
    reloader:
      resources: {}
      # -- Timeout for vtysh commands used in health checks. Increase under heavy VNI load. Defaults to 10s.
      vtyshTimeout: ""
  # -- Datapath to use for L3 forwarding. "kernel" uses the standard Linux
  # kernel datapath; "grout" adds a DPDK-accelerated sidecar that runs
  # alongside FRR (FRR's dplane_grout module syncs routes automatically).
  datapath: "kernel"
  # grout contains configuration for the grout DPDK dataplane sidecar.
  # Only used when datapath is set to "grout".
  grout:
    # -- Use TAP ports for grout underlay interfaces instead of PCI ports.
    tapUnderlay: false
    # -- Run grout in test mode. Test mode requires no hugepages and uses dummy
    # FIB algorithms, which keeps memory usage low at the cost of real longest
    # prefix match lookups. Leave it disabled for a hugepage-backed dataplane,
    # requesting hugepages under grout.resources.
    testMode: false
    # -- Maximum MTU grout accepts on its ports (GROUT_MAX_MTU). The underlay
    # ports take the MTU of the underlay interfaces, so it must be at least as
    # large as the underlay MTU. Larger values grow every packet buffer.
    # Leave it empty to use the grout default (1800).
    maxMTU: ""
    image:
      repository: quay.io/openperouter/router
      tag: "main-grout"
      pullPolicy: ""
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "500m"
  # -- OVS database socket path. Defaults to standard OVS location if not specified.
  ovsSocketPath: ""
  # -- OVS run directory to mount. This is the directory containing the OVS socket.
  ovsRunDir: "/var/run/openvswitch"

webhook:
  enabled: true
  # -- timeoutSeconds of every validating webhook (1-30). Unset keeps the API
  # server's default of 10 s. With failurePolicy Fail, a call that reaches a
  # replica that no longer answers is refused only after this long.
  timeoutSeconds:

crds:
  enabled: true
  validationFailurePolicy: Fail
