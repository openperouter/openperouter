---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: l2trunks.network.openperouter.io
spec:
  group: network.openperouter.io
  names:
    kind: L2Trunk
    listKind: L2TrunkList
    plural: l2trunks
    singular: l2trunk
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: L2Trunk owns a shared attachment for VLAN-tagged L2VNIs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of L2Trunk.
            properties:
              hostMaster:
                description: |-
                  hostMaster is the host bridge the trunk's host-side interface attaches to.
                  The bridge must have lifecycle External.
                  When omitted, the host-side interface is left for external attachment.
                  Immutable.
                properties:
                  linuxBridge:
                    description: linuxBridge configuration. Must be set when Type
                      is "LinuxBridge".
                    properties:
                      lifecycle:
                        description: |-
                          lifecycle determines if the bridge is managed by the controller or
                          provided by the user.
                        enum:
                        - Managed
                        - External
                        type: string
                      name:
                        description: |-
                          name of the Linux bridge interface. Required when lifecycle is
                          External, and must be omitted when it is Managed, in which case the
                          bridge is named br-hs-<VNI>.
                        maxLength: 15
                        pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                        type: string
                    required:
                    - lifecycle
                    type: object
                    x-kubernetes-validations:
                    - message: name must be set when lifecycle is External, and must
                        not be set when it is Managed.
                      rule: (self.?name.orValue("") != "") != (self.?lifecycle.orValue("")
                        == 'Managed')
                  ovsBridge:
                    description: ovsBridge configuration. Must be set when Type is
                      "OVSBridge".
                    properties:
                      lifecycle:
                        description: |-
                          lifecycle determines if the OVS bridge is managed by the controller or
                          provided by the user.
                        enum:
                        - Managed
                        - External
                        type: string
                      name:
                        description: |-
                          name of the OVS bridge interface. Required when lifecycle is
                          External, and must be omitted when it is Managed, in which case the
                          bridge is named br-hs-<VNI>.
                        maxLength: 15
                        pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                        type: string
                    required:
                    - lifecycle
                    type: object
                    x-kubernetes-validations:
                    - message: name must be set when lifecycle is External, and must
                        not be set when it is Managed.
                      rule: (self.?name.orValue("") != "") != (self.?lifecycle.orValue("")
                        == 'Managed')
                  type:
                    description: 'type of the host interface. Supported values: "LinuxBridge",
                      "OVSBridge".'
                    enum:
                    - LinuxBridge
                    - OVSBridge
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: 'type/config mismatch: ''LinuxBridge'' requires linuxBridge
                    field, ''OVSBridge'' requires ovsBridge field'
                  rule: (self.type == 'LinuxBridge' && has(self.linuxBridge) && !has(self.ovsBridge))
                    || (self.type == 'OVSBridge' && has(self.ovsBridge) && !has(self.linuxBridge))
              nodeSelector:
                description: |-
                  nodeSelector specifies which nodes this L2Trunk applies to.
                  If empty or not specified, applies to all nodes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              type:
                description: type selects the kind of port that carries the trunk's
                  tagged traffic.
                enum:
                - Host
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: type is immutable
              rule: self.type == oldSelf.type
            - message: hostMaster is immutable
              rule: has(self.hostMaster) == has(oldSelf.hostMaster) && (!has(self.hostMaster)
                || self.hostMaster == oldSelf.hostMaster)
            - message: L2Trunk does not support managed Linux bridges
              rule: '!has(self.hostMaster) || !has(self.hostMaster.linuxBridge) ||
                self.hostMaster.linuxBridge.lifecycle == ''External'''
            - message: L2Trunk does not support managed OVS bridges
              rule: '!has(self.hostMaster) || !has(self.hostMaster.ovsBridge) || self.hostMaster.ovsBridge.lifecycle
                == ''External'''
          status:
            description: status defines the observed state of L2Trunk.
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
