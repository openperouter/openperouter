apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "openperouter.labels" . | nindent 4 }}
    component: nodemarker
    {{- range $key, $value := .Values.openperouter.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  name: nodemarker
  namespace: {{ .Release.Namespace | quote }}
spec:
  {{- $nm := .Values.openperouter.nodemarker }}
  {{- $replicas := int (default 1 $nm.replicas) }}
  replicas: {{ $replicas }}
  {{- if and (gt $replicas 1) $nm.strategy }}
  strategy:
    {{- toYaml $nm.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openperouter.selectorLabels" . | nindent 6 }}
      component: nodemarker
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nodemarker
      labels:
        {{- include "openperouter.selectorLabels" . | nindent 8 }}
        component: nodemarker
        app: nodemarker
        {{- range $key, $value := .Values.openperouter.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- if .Values.openperouter.runtimeClassName }}
      runtimeClassName: {{ .Values.openperouter.runtimeClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "openperouter.nodemarker.serviceAccountName" . }}
      {{- with .Values.openperouter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openperouter.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with include "openperouter.nodemarker.affinity" . }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- with .Values.openperouter.logLevel }}
        - --loglevel={{ . }}
        {{- end }}
        - "--namespace=$(NAMESPACE)"
        - --leader-elect=true
        - --leader-election-lease-duration={{ $nm.leaderElection.leaseDuration }}
        - --leader-election-renew-deadline={{ $nm.leaderElection.renewDeadline }}
        - --leader-election-retry-period={{ $nm.leaderElection.retryPeriod }}
        {{- if eq .Values.openperouter.datapath "grout" }}
        - --datapath=grout
        {{- end }}
        {{- if .Values.openperouter.hostmode }}
        - "--webhookmode=webhookonly"
        {{- else if not .Values.webhook.enabled }}
        - "--webhookmode=disabled"
        - "--disable-cert-rotation=true"
        {{- end }}
        command:
        - /nodemarker
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        {{- if .Values.webhook.enabled }}
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
        {{- end }}
          - containerPort: 8081
            name: health
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: {{ int $nm.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ int $nm.livenessProbe.failureThreshold }}
        {{- if .Values.webhook.enabled }}
        volumeMounts:
        - name: cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        image: {{ .Values.openperouter.image.repository }}:{{ .Values.openperouter.image.tag | default .Chart.AppVersion }}
        {{- if .Values.openperouter.image.pullPolicy }}
        imagePullPolicy: {{ .Values.openperouter.image.pullPolicy }}
        {{- end }}
        name: nodemarker
        {{- with $nm.preStopSleepSeconds }}
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "{{ int . }}"]
        {{- end }}
        {{- with .Values.openperouter.nodemarker.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: openpe-webhook-server-cert
      {{- end }}
{{- if and (gt $replicas 1) $nm.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "openperouter.labels" . | nindent 4 }}
    component: nodemarker
    {{- range $key, $value := .Values.openperouter.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  name: nodemarker
  namespace: {{ .Release.Namespace | quote }}
spec:
  minAvailable: {{ $nm.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "openperouter.selectorLabels" . | nindent 6 }}
      component: nodemarker
{{- end }}
